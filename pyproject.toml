[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valideval"
version = "0.3.0"
description = "Psychometric validity-auditing toolkit for AI benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["evaluation", "benchmarks", "validity", "psychometrics", "audit"]
authors = [
  { name = "ValidEval contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "ipykernel>=6.29,<7",
  "jsonschema>=4.21,<5",
  "mypy>=1.10,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=7.4",
  "ruff>=0.4",
  "types-PyYAML>=6.0",
]
adoption = []
datasets = [
  "datasets>=2.18",
]
acquisition = [
  "datasets>=2.18",
  "requests>=2.31",
]
importers = []
parquet = [
  "pyarrow>=14",
]
ollama = [
  "requests>=2.31",
]
notebooks = [
  "accelerate>=1.2,<2",
  "datasets>=3.2,<5",
  "safetensors>=0.4,<1",
  "tokenizers>=0.21,<1",
  "torch>=2.5,<3",
  "transformers>=4.47,<6",
]

[project.scripts]
valideval = "valideval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valideval = ["domains/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "bundles",
  "cache",
  "dashboard_data",
  "data/raw",
  "external_review_packet",
  "external_review_packets",
  "leaderboard",
  "local_outputs",
  "reportcards",
  "results",
  "site",
  "validation_reports/_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "datasets",
  "datasets.*",
  "pandas.*",
  "scipy.*",
  "torch",
  "torch.*",
  "transformers",
  "transformers.*",
  "yaml",
  "yaml.*",
]
ignore_missing_imports = true
