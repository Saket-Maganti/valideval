name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check src/valideval tests scripts
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/build_release_v5.py --profile source
      - run: python -m valideval --help
