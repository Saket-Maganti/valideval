schema_version: "5.0"
registry_id: valideval_model_registry_v5
claim_state: RESULT_REQUIRED
identity_policy:
  exact_identity_requires:
    - canonical_model_id
    - checkpoint
    - immutable_revision
    - quantization_class
    - base_or_instruction
    - chat_template
    - prompt_regime
    - decoding_hash
    - extraction_version
  unknown_or_planned_field_behavior: fail_closed_not_exact_identity
  family_name_rule: Never infer exact checkpoint identity from family names.

