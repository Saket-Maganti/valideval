    name: Controlled exact-common-panel study
    benchmarks: [mmlu, gsm8k, bbh]
    exact_identity_status: PARTIAL_EXACT_PANEL_FROZEN
    registry_metadata_verified_at: "2026-07-16"
    registry_metadata_source: https://huggingface.co/api/models/{repository}
    exact_common_panel_ids:
      - Qwen/Qwen2.5-0.5B-Instruct
      - Qwen/Qwen2.5-1.5B-Instruct
      - Qwen/Qwen2.5-3B-Instruct
      - microsoft/Phi-3-mini-4k-instruct
      - TinyLlama/TinyLlama-1.1B-Chat-v1.0
    excluded_until_access_verified:
      - google/gemma-2-2b-it
    inclusion_rule: Same immutable revision and execution identity on every benchmark.

tiers:
  S0:
    artifact_class: NON_EVIDENCE_FIXTURE
    purpose: deterministic code-path validation
    target_models: 2
  S1:
    artifact_class: ENGINEERING_SMOKE
    purpose: loading extraction sharding resume and packaging
    target_models: 2-3
    target_items_per_benchmark: 10-50
  S2:
    artifact_class: EXPLORATORY_EXECUTION_PILOT
    purpose: runtime OOM failure and extraction-rate estimation
    target_models: 4-8
    target_items_per_benchmark: 100-500
  S3:
    artifact_class: MINIMUM_SCIENTIFIC_COMMON_PANEL
    purpose: panel size selected by power and identifiability simulation
    target_models: PLANNED_BY_POWER_AUDIT
  S4:
    artifact_class: FULL_MAXIMUM_CEILING_COMMON_PANEL
    purpose: family scale architecture and ability diversity subject to T4x2 feasibility
    target_models: PLANNED_BY_POWER_AND_RESOURCE_AUDIT
  S5:
    artifact_class: ROBUSTNESS_EXTENSION
    purpose: optional models prompt regimes and scoring conditions
    target_models: OPTIONAL

